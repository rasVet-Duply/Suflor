name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unpack and build
        shell: pwsh
        run: |
          Expand-Archive -Path SchoolDesk.zip -DestinationPath unpacked
          Set-Location unpacked/SchoolDesk
          ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolDesk-win-x64
          path: unpacked/SchoolDesk/dist/SchoolDesk-win-x64.zip
