<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroStat — суфлёр для озвучки</title>
<style>
:root{--bg:#f3f6ef;--panel:#fff;--text:#062b20;--muted:#5d7468;--done:#1f8a52;--hi:#c8f04d;--hiText:#062b20;--warn:#e69a00;--warnText:#1b1200;--line:#cfdacb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06231a;--panel:#0c3a2b;--text:#f2f7ee;--muted:#9db8aa;--done:#c8f04d;--warn:#ffb21e;--line:#1d5340}}
:root[data-theme="dark"]{--bg:#06231a;--panel:#0c3a2b;--text:#f2f7ee;--muted:#9db8aa;--done:#c8f04d;--warn:#ffb21e;--line:#1d5340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px 8px;font-size:14px;color:var(--muted)}
.tot{font-variant-numeric:tabular-nums;font-weight:600}
.bars{display:flex;gap:3px;height:6px;padding:0 16px}
.bars div{background:var(--line);border-radius:3px;overflow:hidden}
.bars i{display:block;height:100%;width:0;background:var(--done)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:1000px;margin:0 auto;padding:16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;color:var(--muted);font-size:14px}
.meta .right{display:flex;align-items:center;gap:12px}
.cue{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cue.pre{border:1px solid var(--line);color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
.cue.go{background:var(--hi);color:var(--hiText)}
.cue.stop{background:var(--warn);color:var(--warnText)}
.text{margin:0;font-size:clamp(24px,5.2vw,52px);line-height:1.45;font-weight:600}
.w{opacity:.5;padding:.03em .1em;border-radius:.22em;transition:color .15s,background .15s,opacity .15s}
.text.pre .w{opacity:.9}
.w.done{opacity:1;color:var(--done)}
.w.now{opacity:1;background:var(--hi);color:var(--hiText)}
.hint{margin:22px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
footer{padding:10px 16px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.next{color:var(--muted);font-size:14px;text-align:center;min-height:20px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:12px 22px}
.btn.big{background:var(--hi);color:var(--hiText);border-color:transparent;font-size:20px;padding:14px 52px}
body:not([data-state="idle"]) .idle-only{display:none}
body[data-state="idle"] .run-only{display:none}
body[data-state="done"] #pz{display:none}
body:not([data-state="done"]) .done-only{display:none}
.mic{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);min-height:34px;flex-wrap:wrap;justify-content:center}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.mic.ok .dot{background:var(--done)}
.mic.bad .dot{background:#d33}
.lvl{width:110px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--done);transition:width .06s linear}
.mic .btn{padding:6px 14px;font-size:14px}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d33;margin-right:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.player{width:100%;max-width:520px}
.player audio{width:100%}
.player .cap{text-align:center;color:var(--muted);font-size:14px;margin-bottom:6px}
.btn.send{background:var(--hi);color:var(--hiText);border-color:transparent;font-size:18px;padding:14px 36px}
.btn[disabled]{opacity:.45;cursor:default}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#gate.off{display:none}
#gate .ic{font-size:64px;line-height:1}
#gate h2{margin:0;font-size:26px}
#gate p{margin:0;color:var(--muted);font-size:16px;max-width:420px;line-height:1.4}
#gate .btn{font-size:20px;padding:14px 44px;background:var(--hi);color:var(--hiText);border-color:transparent}
</style>
</head>
<body data-state="idle">
<div id="gate"><div class="ic">🎙️</div><h2>Разрешите микрофон</h2><p id="gateTxt">Нажмите «Разрешить» в окне браузера</p><button id="gateBtn" class="btn" style="display:none">Разрешить</button></div>
<header><div>AgroStat · суфлёр для озвучки</div><div id="tot" class="tot"></div></header>
<div id="bars" class="bars"></div>
<main>
  <div class="meta"><div id="lab"></div><div class="right"><span id="left"></span><span id="cue" class="cue pre"></span></div></div>
  <p id="text" class="text pre"></p>
</main>
<footer>
  <div id="mic" class="mic"><span class="dot"></span><span id="micTxt" style="display:none"></span><span class="lvl"><i id="lvl"></i></span></div>
  
  <div id="player" class="player done-only"><div class="cap" id="cap" style="display:none"></div><audio id="aud" controls playsinline></audio></div>
  <div class="ctl">
    <button id="go" class="btn big idle-only" disabled>Старт</button>
    <button id="snd" class="btn send done-only" disabled>Отправить</button>
    <button id="pz" class="btn run-only">Пауза</button>
    <button id="rs" class="btn run-only">Заново</button>
  </div>
</footer>
<script>
var S=[
{t:"AgroStat",d:9,x:"AgroStat — fermer xo‘jaligini boshqarishni soddalashtiradigan yagona raqamli panel. Muhim ma’lumotlar endi bitta ekranda."},
{t:"Ferma haqida to‘liq manzara",d:11,x:"AgroStat hayvonlar, mahsulot, moliya, chiqindilar, jamoa va sozlamalarni yagona tizimga birlashtiradi. Ferma haqidagi to‘liq manzarani bir necha soniyada ko‘rish mumkin."},
{t:"Bir qarashda asosiy ko‘rsatkichlar",d:12,x:"Boshqaruv panelida jami hayvonlar, kasal hayvonlar, sut hajmi va sof foyda ko‘rsatiladi. Bu ekrandagi raqamlar demo ma’lumotlar bo‘lib, tizim qanday ishlashini ko‘rsatadi."},
{t:"Har bir hayvon — alohida raqamli profil",d:14,x:"Har bir hayvon uchun alohida raqamli profil yaratiladi. Unda hayvon turi, vazni, sog‘lig‘i, kelgan sanasi va ozuqa tarkibi haqida ma’lumotlar saqlanadi. Bu kuzatuvni ancha qulaylashtiradi."},
{t:"Moliya va chiqindilar",d:14,x:"Moliya bo‘limi daromad, xarajat va sof foydani ko‘rsatadi. Chiqindilar bo‘limi esa go‘ng, biogaz yoki o‘g‘itga yo‘naltirilgan va tashlangan chiqindilarni hisobga olishga yordam beradi."},
{t:"Jamoa bilan ishlash oson",d:10,x:"Jamoani tizimga taklif havolasi yoki maxsus kod orqali qo‘shish mumkin. Direktor va xodim rollari yordamida ish jarayoni tartibli va nazorat qilinadigan bo‘ladi."},
{t:"AgroStat: ma’lumotdan qarorgacha",d:10,x:"AgroStatning asosiy g‘oyasi oddiy: ferma murakkabligini sodda, ko‘rinadigan va boshqariladigan qilish. Ma’lumotlar bir joyda bo‘lsa, to‘g‘ri qaror qabul qilish ham osonlashadi."}
];
var COUNT=5, PAUSE=500, TOTAL=0, $=function(id){return document.getElementById(id)};
S.forEach(function(s){
  s.o=TOTAL; TOTAL+=s.d*1000;
  s.w=s.x.split(/\s+/);
  var k=s.w.map(function(w){return w.length+1+(/[.:]$/.test(w)?5:/[,;]$/.test(w)?3:0)});
  var sum=k.reduce(function(a,b){return a+b},0), sp=s.d*1000-PAUSE, acc=0;
  s.tm=k.map(function(v){var st=acc/sum*sp; acc+=v; return st});
});
var bars=$("bars"), fills=[];
S.forEach(function(s){var d=document.createElement("div"),i=document.createElement("i");d.style.flex=s.d;d.appendChild(i);bars.appendChild(d);fills.push(i)});
var textEl=$("text"), spans=[], cur=-1, lastW=-9, elapsed=0, running=false, last=0, raf=0, paused=false;
function fmt(ms){var s=Math.floor(Math.max(0,ms)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function cue(c,t){var e=$("cue");e.className="cue "+c;e.textContent=t}
function show(i){
  cur=i; lastW=-9; textEl.textContent=""; spans=[];
  S[i].w.forEach(function(w){var e=document.createElement("span");e.className="w";e.textContent=w;textEl.appendChild(e);textEl.appendChild(document.createTextNode(" "));spans.push(e)});
  $("lab").textContent="Слайд "+(i+1)+" / "+S.length+" · "+S[i].t;
}
function setW(k){
  if(k===lastW)return; lastW=k;
  spans.forEach(function(e,j){e.className="w"+(j<k?" done":j===k?" now":"")});
}
function setBars(i,local){fills.forEach(function(f,j){f.style.width=(j<i?100:j===i?local/(S[j].d*10):0)+"%"})}
function render(){
  var e=elapsed;
  if(e<0){
    if(cur!==0)show(0);
    textEl.classList.add("pre"); setW(-1); setBars(-1,0);
    cue("pre","Старт через "+Math.ceil(-e/1000)+" с"); $("left").textContent="";
    $("tot").textContent="0:00 / "+fmt(TOTAL); return;
  }
  textEl.classList.remove("pre");
  var i=0; while(i<S.length-1&&e>=S[i+1].o)i++;
  var s=S[i], local=e-s.o, sp=s.d*1000-PAUSE;
  if(i!==cur)show(i);
  if(local<sp){var k=0;while(k<s.w.length-1&&local>=s.tm[k+1])k++;setW(k);cue("go","● Говорите")}
  else{setW(s.w.length);cue("stop","Пауза")}
  $("left").textContent="осталось "+Math.ceil((s.d*1000-local)/1000)+" с";
  setBars(i,local); $("tot").textContent=fmt(e)+" / "+fmt(TOTAL);
}
function tick(now){
  if(!running)return;
  elapsed+=Math.max(0,now-last); last=now;
  if(elapsed>=-300)startRec();
  if(elapsed>=TOTAL){finish();return}
  render(); raf=requestAnimationFrame(tick);
}
var stream=null, actx=null, an=null, lvlBuf=null, rec=null, chunks=[], recStarted=false, blob=null, aUrl=null, sending=false;
var MT=["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm;codecs=opus","audio/webm"], mime="";
if(window.MediaRecorder){for(var q=0;q<MT.length;q++){if(MediaRecorder.isTypeSupported(MT[q])){mime=MT[q];break}}}
var EXT=/mp4/.test(mime)?"mp4":"webm";
function micUI(c,t,btn){
  $("mic").className="mic "+c;$("go").disabled=(c!=="ok");
  $("gate").className=(c==="ok")?"off":"";
  $("gateTxt").textContent=(c==="ok")?"":(t||"Нажмите «Разрешить» в окне браузера");
  $("gateBtn").style.display=btn?"":"none";
}
function initMic(){
  if(!window.isSecureContext){micUI("bad","Микрофон работает только на странице с https://. Откройте ссылку на сайт, а не файл.",false);return Promise.resolve()}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){micUI("bad","Браузер не поддерживает запись. Откройте в Chrome или Safari.",false);return Promise.resolve()}
  micUI("","",false);
  var c={audio:{channelCount:1,sampleRate:48000,echoCancellation:false,noiseSuppression:true,autoGainControl:true}};
  return navigator.mediaDevices.getUserMedia(c).catch(function(e){
    if(e&&(e.name==="OverconstrainedError"||e.name==="TypeError"))return navigator.mediaDevices.getUserMedia({audio:true});
    throw e;
  }).then(function(st){
    if(stream)stream.getTracks().forEach(function(t){t.stop()});
    stream=st;
    st.getAudioTracks()[0].onended=function(){stream=null;micUI("bad","Микрофон отключился. Нажмите «Разрешить».",true)};
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      an=actx.createAnalyser();an.fftSize=512;lvlBuf=new Uint8Array(an.fftSize);
      actx.createMediaStreamSource(st).connect(an);
    }catch(x){}
    micUI("ok","",false);
  }).catch(function(e){
    stream=null;
    var d=e&&(e.name==="NotAllowedError"||e.name==="SecurityError");
    micUI("bad",d?"Доступ запрещён. Нажмите на замок рядом с адресом, разрешите микрофон и нажмите кнопку.":"Микрофон не найден или занят другим приложением.",true);
  });
}
function meter(){
  if(an){an.getByteTimeDomainData(lvlBuf);var m=0;for(var i=0;i<lvlBuf.length;i++){var v=Math.abs(lvlBuf[i]-128);if(v>m)m=v}
    $("lvl").style.width=Math.min(100,m/128*220)+"%"}
  requestAnimationFrame(meter);
}
function startRec(){
  if(recStarted||!stream)return; recStarted=true; chunks=[];
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:128000}:{audioBitsPerSecond:128000})}catch(x){rec=new MediaRecorder(stream)}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=function(){
    var type=(rec&&rec.mimeType)||mime||"audio/mp4";
    blob=new Blob(chunks,{type:type});
    if(aUrl)URL.revokeObjectURL(aUrl);
    aUrl=URL.createObjectURL(blob);$("aud").src=aUrl;
    $("snd").disabled=false;
  };
  rec.start(1000);
}
function stopRec(){try{if(rec&&rec.state!=="inactive")rec.stop()}catch(x){}}
function discardRec(){
  if(rec){rec.onstop=null;try{if(rec.state!=="inactive")rec.stop()}catch(x){}}
  rec=null;recStarted=false;chunks=[];blob=null;
  $("aud").pause();$("aud").removeAttribute("src");$("aud").load();
  if(aUrl){URL.revokeObjectURL(aUrl);aUrl=null}
  $("snd").disabled=true;
}
function sendRec(){
  if(!blob||sending)return;
  var type=blob.type.split(";")[0]||"audio/mp4";
  var ext=/mp4/.test(type)?"mp4":"webm";
  var f=new File([blob],"agrostat-golos."+ext,{type:type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    sending=true;
    navigator.share({files:[f],title:"AgroStat — озвучка"}).catch(function(){}).then(function(){sending=false});
  }else{
    var a=document.createElement("a");a.href=aUrl;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
    
  }
}
function lock(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(x){}}
function start(){
  if(!stream){initMic().then(function(){if(stream)start()});return}
  if(actx&&actx.state==="suspended")actx.resume();
  discardRec();
  elapsed=-COUNT*1000; paused=false; running=true; last=performance.now();
  document.body.dataset.state="run"; $("pz").textContent="Пауза"; lock();
  render(); raf=requestAnimationFrame(tick);
}
function finish(){
  running=false; cancelAnimationFrame(raf);
  $("snd").disabled=true;stopRec();
  document.body.dataset.state="done";
  show(S.length-1); setW(S[S.length-1].w.length); setBars(S.length,0);
  fills.forEach(function(f){f.style.width="100%"});
  cue("go","Готово"); $("left").textContent=""; $("tot").textContent=fmt(TOTAL)+" / "+fmt(TOTAL);
}
function reset(){
  discardRec();
  running=false; paused=false; cancelAnimationFrame(raf); elapsed=-COUNT*1000;
  document.body.dataset.state="idle"; show(0); setW(-1); setBars(-1,0);
  textEl.classList.add("pre"); cue("pre","Готово к старту"); $("left").textContent="";
  $("tot").textContent="0:00 / "+fmt(TOTAL);
}
function toggle(){
  if(document.body.dataset.state!=="run")return;
  if(running){running=false;paused=true;cancelAnimationFrame(raf);try{if(rec&&rec.state==="recording")rec.pause()}catch(x){}$("pz").textContent="Продолжить";cue("pre","На паузе")}
  else{paused=false;running=true;last=performance.now();try{if(rec&&rec.state==="paused")rec.resume()}catch(x){}$("pz").textContent="Пауза";raf=requestAnimationFrame(tick)}
}
$("go").onclick=function(){start()};
$("snd").onclick=sendRec;

/* Запрашиваем доступ только после явного нажатия: браузеры часто
   блокируют запрос микрофона, сделанный автоматически при загрузке. */
$("gateBtn").style.display="";
$("gateBtn").textContent="Разрешить микрофон";
$("gateBtn").onclick=function(){
  $("gateBtn").disabled=true;
  $("gateBtn").textContent="Ожидание разрешения…";
  initMic().then(function(){
    $("gateBtn").disabled=false;
    $("gateBtn").textContent="Разрешить микрофон";
  });
};
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&document.body.dataset.state==="idle"){
    var t=stream&&stream.getAudioTracks()[0];
    if(!t||t.readyState==="ended"){
      micUI("bad","Нажмите «Разрешить микрофон», чтобы снова подключить микрофон.",true);
    }
  }
});
$("pz").onclick=function(){toggle();this.blur()};
$("rs").onclick=function(){reset();this.blur()};
document.addEventListener("keydown",function(e){
  if(e.code==="Space"){
    var st=document.body.dataset.state;
    if(st==="done"||(e.target&&/BUTTON|AUDIO/.test(e.target.tagName)))return;
    e.preventDefault();
    if(st==="idle"){if(!$("go").disabled)start()} else if(st==="run")toggle();
  }else if(e.code==="KeyR"&&document.body.dataset.state==="run")reset();
});
reset();
meter();
micUI("bad","Нажмите кнопку ниже и разрешите доступ к микрофону в браузере.",true);
</script>
</body>
</html>
